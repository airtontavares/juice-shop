  name: DAST - ZAP Baseline Scan

  on:
    workflow_dispatch:
  
  jobs:
    zap_scan:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Start Juice Shop
          run: |
            docker run -d --name juice-shop --network host bkimminich/juice-shop
            for i in {1..30}; do
              curl -sf http://localhost:3000 && break
              echo "waiting for juice shop..."; sleep 5
            done

        - name: Run ZAP Baseline Scan
          run: |
            mkdir -p zap-report
            chmod 777 zap-report                                                                                                                
            docker run --network host -v $(pwd)/zap-report:/zap/wrk/:rw \
              -t zaproxy/zap-stable zap-baseline.py \
              -t http://localhost:3000 \
              -r zap-report.html -x zap-report.xml -J zap-report.json \
              -I

        - name: Upload ZAP report
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: zap-baseline-report
            path: zap-report/
